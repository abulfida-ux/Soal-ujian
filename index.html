<!DOCTYPE html>
<html lang="id">
<head>

        :root {
            --bg-dark: #0f172a;

            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px 10px 80px 10px;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Cyber Glassmorphism */
        .header-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-field {
            margin-top: 15px;
            position: relative;
        }

        .user-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
        }

        .user-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-blue);
        }

        /* Navigasi Tab Futuristik */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 14px;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(129, 140, 248, 0.2) 100%);
            border-color: var(--accent-blue);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
        }

        /* Soal Container */
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .q-text {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .audio-btn:hover { background: rgba(56, 189, 248, 0.3); }

        .opt-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .opt-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        .opt-card input { display: none; }

        .opt-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .opt-card.selected .opt-radio {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
        }

        .opt-card.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: #6ee7b7;
        }

        .opt-card.wrong {
            background: rgba(244, 63, 94, 0.15) !important;
            border-color: var(--danger) !important;
            color: #fca5a5;
        }

        .btn-check {
            width: 100%;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-check:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* Floating Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
            transition: all 0.3s;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 189, 248, 0.6); }

        /* Kartu Nilai Dashboard */
        .result-overlay {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(20px);

            from { opacity: 0; transform: scale(0.9); }

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }
    </style>
</head>

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
        } else if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(100, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    function switchTab(tabName) {
        playSound('click');
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabName}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }

            { q: "16. Perilaku hemat dan tidak mewah mencerminkan sila...", opts: ["A. Sila ke-5", "B. Sila ke-1", "C. Sila ke-2", "D. Sila ke-3"], ans: 0 },
            { q: "17. Mengapa antarsila Pancasila tidak bisa dipisahkan?", opts: ["A. Ketetapan undang-undang", "B. Saling menjiwai dan dijiwai", "C. Dibuat satu orang", "D. Lambangnya mirip"], ans: 1 },
            { q: "18. Contoh pengamalan sila keempat di masyarakat adalah...", opts: ["A. Pemilihan ketua RT secara musyawarah/pemungutan suara jujur", "B. Kerja bakti", "C. Memberi sumbangan", "D. Berdoa"], ans: 0 },
            { q: "19. Menjaga fasilitas umum di sekolah mencerminkan sila...", opts: ["A. Sila ke-3 dan ke-5", "B. Sila ke-1", "C. Sila ke-2", "D. Sila ke-4"], ans: 0 },
            { q: "20. Semboyan negara Indonesia adalah...", opts: ["A. Tut Wuri Handayani", "B. Bhinneka Tunggal Ika", "C. Gemah Ripah", "D. Jer Basuki"], ans: 1 }
        ]
    };

    function renderAllSoal() {
        ['indo', 'inggris', 'pkn'].forEach(mapel => {
            const container = document.getElementById(`tab-${mapel}`);
            let html = "";
            bankSoal[mapel].forEach((item, idx) => {
                const cleanText = item.q.replace(/'/g, "\\'");
                html += `
                <div class="q-card">
                    <div class="q-text">${item.q}</div>
                    <button type="button" class="audio-btn" onclick="speakText('${cleanText}')">
                        <i class="fa-solid fa-volume-high"></i> BACA SOAL
                    </button>
                    <div class="opt-grid">`;
                
                item.opts.forEach((opt, optIdx) => {
                    const idVal = `${mapel}_${idx}_${optIdx}`;
                    html += `
                    <label class="opt-card" id="box_${idVal}" onclick="selectOption('${mapel}', ${idx}, ${optIdx})">
                        <input type="radio" name="${mapel}_${idx}" value="${optIdx}" id="${idVal}">
                        <div class="opt-radio"></div>
                        <span style="font-weight:600; font-size:0.9rem;">${opt}</span>
                    </label>`;
                });

                html += `
                    </div>
                    <button type="button" class="btn-check" onclick="cekJawabanDirect('${mapel}', ${idx})">
                        <i class="fa-solid fa-square-check"></i> VERIFIKASI JAWABAN
                    </button>
                </div>`;
            });
            container.innerHTML = html;
        });
    }

    function selectOption(mapelKey, qIdx, optIdx) {
        playSound('click');
        for (let i = 0; i < 4; i++) {
            const el = document.getElementById(`box_${mapelKey}_${qIdx}_${i}`);
            if (el) el.classList.remove('selected');
        }
        const selectedEl = document.getElementById(`box_${mapelKey}_${qIdx}_${optIdx}`);
        if (selectedEl) selectedEl.classList.add('selected');
    }

    function cekJawabanDirect(mapelKey, questionIdx) {
        const selected = document.querySelector(`input[name="${mapelKey}_${questionIdx}"]:checked`);
        if (!selected) return;

        const selectedVal = parseInt(selected.value);
        const correctVal = bankSoal[mapelKey][questionIdx].ans;

        for (let i = 0; i < 4; i++) {
            const el = document.getElementById(`box_${mapelKey}_${questionIdx}_${i}`);
            if (el) el.classList.remove('correct', 'wrong');
        }

        const selectedBox = document.getElementById(`box_${mapelKey}_${questionIdx}_${selectedVal}`);
        const correctBox = document.getElementById(`box_${mapelKey}_${questionIdx}_${correctVal}`);

        if (selectedVal === correctVal) {
            if (selectedBox) selectedBox.classList.add('correct');
            playSound('correct');
        } else {
            if (selectedBox) selectedBox.classList.add('wrong');
            if (correctBox) correctBox.classList.add('correct');
            playSound('wrong');
        }
    }

    function hitungNilai() {
        playSound('correct');

        const nama = document.getElementById('namaSiswa').value || "Siswa";
        let scoreIndo = 0, scoreInggris = 0, scorePkn = 0;

        bankSoal.indo.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="indo_${idx}"]:checked`);
            if (selected && parseInt(selected.value) === item.ans) scoreIndo += 5;
        });

        bankSoal.inggris.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="inggris_${idx}"]:checked`);
            if (selected && parseInt(selected.value) === item.ans) scoreInggris += 5;
        });

        bankSoal.pkn.forEach((item, idx) => {
            let selected = document.querySelector(`input[name="pkn_${idx}"]:checked`);
            if (selected && parseInt(selected.value) === item.ans) scorePkn += 5;
        });

        let totalRata = (scoreIndo + scoreInggris + scorePkn) / 3;

        document.getElementById('res-nama').innerText = `Kandidat: ${nama}`;
        document.getElementById('res-indo').innerText = `${scoreIndo}`;
        document.getElementById('res-inggris').innerText = `${scoreInggris}`;
        document.getElementById('res-pkn').innerText = `${scorePkn}`;
        document.getElementById('res-total').innerText = totalRata.toFixed(1);
        
        let overlay = document.getElementById('result-overlay');
        overlay.style.display = 'block';
        overlay.scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener("DOMContentLoaded", renderAllSoal);
</script>

</body>
</html>
