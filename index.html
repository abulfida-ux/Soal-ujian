<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STS PRO CBT - Khidmatussunnah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px 10px 80px 10px;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Cyber Glassmorphism */
        .header-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-field {
            margin-top: 15px;
            position: relative;
        }

        .user-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px 12px 42px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
        }

        .user-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-blue);
        }

        /* Navigasi Tab Futuristik */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 14px;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(129, 140, 248, 0.2) 100%);
            border-color: var(--accent-blue);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
        }

        /* Soal Container */
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .q-text {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .audio-btn:hover { background: rgba(56, 189, 248, 0.3); }

        .opt-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .opt-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        .opt-card input { display: none; }

        .opt-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .opt-card.selected .opt-radio {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
        }

        .opt-card.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: #6ee7b7;
        }

        .opt-card.wrong {
            background: rgba(244, 63, 94, 0.15) !important;
            border-color: var(--danger) !important;
            color: #fca5a5;
        }

        .btn-check {
            width: 100%;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-check:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* Floating Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
            transition: all 0.3s;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(56, 189, 248, 0.6); }

        /* Kartu Nilai Dashboard */
        .result-overlay {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            margin-top: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .score-big {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-card">
        <div class="brand-title"><i class="fa-solid fa-microchip"></i> CBT EXAM PRO</div>
        <div style="font-size:0.8rem; color:var(--text-sub);">Salafiyah Ula Khidmatussunnah</div>
        <div class="user-field">
            <i class="fa-solid fa-user-astronaut input-icon"></i>
            <input type="text" id="namaSiswa" class="user-input" placeholder="Masukkan Nama Siswa..." value="Musa Alfata">
        </div>
    </div>

    <div class="nav-grid">
        <div class="nav-item active" onclick="switchTab('indo')"><i class="fa-solid fa-book"></i> INDONESIA</div>
        <div class="nav-item" onclick="switchTab('inggris')"><i class="fa-solid fa-globe"></i> INGGRIS</div>
        <div class="nav-item" onclick="switchTab('pkn')"><i class="fa-solid fa-shield-halved"></i> PKN</div>
    </div>

    <form id="examForm">
        <div id="tab-indo" class="tab-content active"></div>
        <div id="tab-inggris" class="tab-content"></div>
        <div id="tab-pkn" class="tab-content"></div>

        <button type="button" class="btn-submit" onclick="hitungNilai()">
            <i class="fa-solid fa-paper-plane"></i> SUBMIT ALL ANSWERS
        </button>
    </form>

    <div id="result-overlay" class="result-overlay">
        <i class="fa-solid fa-trophy" style="font-size:2.5rem; color:#f59e0b;"></i>
        <h2 style="margin-top:10px; font-weight:800;">PERFORMANCE REPORT</h2>
        <div id="res-nama" style="color:var(--text-sub); font-weight:600; margin-top:4px;">-</div>

        <div class="score-big" id="res-total">0.0</div>

        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:20px;">
            <div style="background:rgba(15,23,42,0.6); padding:12px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-sub);">INDO</div>
                <div style="font-size:1.1rem; font-weight:700; color:var(--accent-blue);" id="res-indo">0</div>
            </div>
            <div style="background:rgba(15,23,42,0.6); padding:12px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-sub);">INGGRIS</div>
                <div style="font-size:1.1rem; font-weight:700; color:var(--accent-purple);" id="res-inggris">0</div>
            </div>
            <div style="background:rgba(15,23,42,0.6); padding:12px; border-radius:12px;">
                <div style="font-size:0.75rem; color:var(--text-sub);">PKN</div>
                <div style="font-size:1.1rem; font-weight:700; color:var(--success);" id="res-pkn">0</div>
            </div>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.start(now);
            osc.stop(now + 0.04);
        } else if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(100, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    function switchTab(tabName) {
        playSound('click');
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabName}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }
    }
