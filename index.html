<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ujian STS Kelas 6 - Khidmatussunnah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0d9488;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1e293b;
            --correct: #22c55e;
            --wrong: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #e0f2fe;
            color: var(--text);
            margin: 0;
            padding: 15px 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--primary); font-size: 1.5rem; margin: 0 0 5px 0; }
        .subtitle { color: #64748b; font-size: 0.9rem; }
        .section-title {
            background: var(--primary);
            color: white;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 30px 0 15px 0;
        }
        .question-box {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
        }
        .question-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
        .btn-audio {
            background: #dbeafe;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-block;
            margin-top: 5px;
            font-weight: 600;
        }
        .option-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 16px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 500;
        }
        .option-item input[type="radio"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .option-item.correct {
            background-color: #dcfce7 !important;
            border-color: var(--correct) !important;
            color: #15803d;
            font-weight: 700;
        }
        .option-item.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--wrong) !important;
            color: #b91c1c;
        }
        .btn-check {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-submit {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
        }
        .result-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin-top: 25px;
            display: none;
            border: 2px solid #cbd5e1;
            text-align: center;
        }
        .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .score-card { background: #f8fafc; padding: 12px 5px; border-radius: 10px; border: 1px solid #cbd5e1; }
        .score-card .title { font-size: 0.8rem; color: #64748b; }
        .score-card .value { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-top: 4px; }
        .total-badge {
            display: block;
            background: #f0fdf4;
            color: #166534;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid #bbf7d0;
        }
        @media (max-width: 600px) { .score-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Simulasi STS Kelas 6</h1>
        <div class="subtitle">Salafiyah Ula Khidmatussunnah</div>
    </div>

    <form id="examForm">
        <div class="section-title"><i class="fa-solid fa-book"></i> Bahasa Indonesia</div>
        <div id="render-indo"></div>

        <div class="section-title"><i class="fa-solid fa-language"></i> Bahasa Inggris</div>
        <div id="render-inggris"></div>

        <div class="section-title"><i class="fa-solid fa-flag"></i> PKN</div>
        <div id="render-pkn"></div>

        <button type="button" class="btn-submit" onclick="hitungNilai()">
            <i class="fa-solid fa-paper-plane"></i> Selesai & Lihat Nilai
        </button>
    </form>

    <div id="hasil-container" class="result-box">
        <h2 style="margin-top:0; color:var(--primary);">Hasil Ujian</h2>
        <div class="score-grid">
            <div class="score-card"><div class="title">B. Indonesia</div><div class="value" id="res-indo">0</div></div>
            <div class="score-card"><div class="title">B. Inggris</div><div class="value" id="res-inggris">0</div></div>
            <div class="score-card"><div class="title">PKN</div><div class="value" id="res-pkn">0</div></div>
        </div>
        <div class="total-badge" id="res-total">Nilai Rata-rata: 0</div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.setValueAtTime(140, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            window.speechSynthesis.speak(utterance);
        }
    }
